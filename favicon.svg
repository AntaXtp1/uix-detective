<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <clipPath id="roundClip">
      <rect width="32" height="32" rx="7"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0d0d15"/>

  <!-- Subtle inner glow -->
  <rect width="32" height="32" rx="7" fill="url(#iconGrad)" opacity="0.08"/>

  <!-- Magnifying glass circle -->
  <circle cx="13.5" cy="13.5" r="7.5" stroke="url(#iconGrad)" stroke-width="2.2" clip-path="url(#roundClip)"/>

  <!-- Cross/grid inside lens — represents UI inspection -->
  <line x1="13.5" y1="9" x2="13.5" y2="18" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
  <line x1="9" y1="13.5" x2="18" y2="13.5" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.35"/>

  <!-- Center dot -->
  <circle cx="13.5" cy="13.5" r="1.5" fill="url(#iconGrad)" opacity="0.9"/>

  <!-- Handle -->
  <line x1="19.2" y1="19.2" x2="24.5" y2="24.5" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
